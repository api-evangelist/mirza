name: Mirza
description: >-
  Mirza is a public benefits infrastructure platform that helps government
  agencies, health plans and MCOs, health systems, and employers enroll people
  in social safety-net programs (Medicaid, SNAP, WIC, childcare subsidies, and
  more) and keep them covered as eligibility rules change. It matches individuals
  to 200+ benefits across all 50 states, verifies eligibility from existing data
  rather than paperwork, prevents disenrollment through early exemption detection,
  and generates audit-ready compliance documentation including H.R.1 Medicaid
  community-engagement support. Mirza integrates with existing eligibility systems
  rather than replacing them. Founded in 2020 by Siran Cao and Mel Faxon; backed
  by 500 Global and others.
